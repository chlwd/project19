  <style>
    :root {

      background: #e2e8f0;

      font-size: 11px;
      font-weight: 700;
      background: var(--danger);
      color: #fff;
      line-height: 1.1;
    }

    function getTodayISO() {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function addDaysISO(baseISO, delta) {
      var p = baseISO.split('-').map(Number);
      var d = new Date(p[0], p[1] - 1, p[2] + delta);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function getDiffDaysFromToday(iso) {
      var t = getTodayISO().split('-').map(Number);
      var p = iso.split('-').map(Number);
      var d1 = new Date(t[0], t[1] - 1, t[2]);
      var d2 = new Date(p[0], p[1] - 1, p[2]);
      return Math.round((d2.getTime() - d1.getTime()) / 86400000);
    }

    function formatKoreanDate(iso) {
      if (!iso) return '';
      var p = iso.split('-').map(Number);
      if (p.length !== 3 || isNaN(p[0])) return iso;
      var d = new Date(p[0], p[1] - 1, p[2]);
      var days = ['일', '월', '화', '수', '목', '금', '토'];
      return p[0] + '.' + String(p[1]).padStart(2, '0') + '.' + String(p[2]).padStart(2, '0') + ' (' + days[d.getDay()] + ')';
    }

    // NEIS 나이스 기준 바이트 계산 (한글/비ASCII 3바이트, 영문/숫자/공백 1바이트)
    function calcNeisBytes(text) {
      var str = String(text || '');
      var bytes = 0;
      for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        if (code <= 0x7f) bytes += 1;
        else bytes += 3;
      }
      return bytes;
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function uid(prefix) {
      return (prefix || 'id') + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    }

    // 6. 클라이언트 첨부파일 텍스트 스캔 (TXT, CSV, MD, PDF, DOCX, PPTX 지원)
    // =========================================================================
    function extractReadableFromBinary(bytes) {
      // UTF-8 디코딩 후 가독 문자(한글, 영문, 숫자, 문장부호) 정리
      var text = '';
      try {
        text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      } catch (e) {
        for (var i = 0; i < Math.min(bytes.length, 60000); i++) {
          if (bytes[i] >= 32 && bytes[i] <= 126) text += String.fromCharCode(bytes[i]);
        }
      }
      // PDF 괄호 스트림 텍스트 추출 보강
      var pdfPieces = [];
      var re = /\(([^()]{2,200})\)\s*Tj/g;
      var m;
      while ((m = re.exec(text)) !== null) {
        pdfPieces.push(m[1]);
      }
      if (pdfPieces.length > 3) {
        return pdfPieces.join(' ').replace(/\s+/g, ' ').trim();
      }
      // 일반 가독 한글·영문 블록 추출
      var clean = text.replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s.,!?():;'"%\-\/\n]/g, ' ')
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      return clean.slice(0, 4000);
    }

    async function inflateRawBrowser(u8) {
      if (typeof DecompressionStream === 'undefined') return null;
      try {
        var ds = new DecompressionStream('deflate-raw');
        var writer = ds.writable.getWriter();
        writer.write(u8);
        writer.close();
        var buf = await new Response(ds.readable).arrayBuffer();
        return new Uint8Array(buf);
      } catch (e) {
        return null;
      }
    }

    async function extractZipXmlText(bytes, pattern) {
      var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      var eocd = -1;
      for (var i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) {
          eocd = i; break;
        }
      }
      if (eocd === -1) return '';
      var cdCount = view.getUint16(eocd + 10, true);
      var ptr = view.getUint32(eocd + 16, true);
      var texts = [];
      for (var idx = 0; idx < cdCount && ptr + 46 <= bytes.length; idx++) {
        if (view.getUint32(ptr, true) !== 0x02014b50) break;
        var method = view.getUint16(ptr + 10, true);
        var compSize = view.getUint32(ptr + 20, true);
        var nameLen = view.getUint16(ptr + 28, true);
        var extraLen = view.getUint16(ptr + 30, true);
        var commentLen = view.getUint16(ptr + 32, true);
        var localOff = view.getUint32(ptr + 42, true);
        var fname = new TextDecoder('utf-8').decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
        ptr += 46 + nameLen + extraLen + commentLen;
        if (!pattern.test(fname)) continue;
        if (localOff + 30 > bytes.length) continue;
        var lfnLen = view.getUint16(localOff + 26, true);
        var lfeLen = view.getUint16(localOff + 28, true);
        var dStart = localOff + 30 + lfnLen + lfeLen;
        var slice = bytes.subarray(dStart, Math.min(bytes.length, dStart + compSize));
        var plain = method === 0 ? slice : (method === 8 ? await inflateRawBrowser(slice) : null);
        if (plain) {
          var xml = new TextDecoder('utf-8', { fatal: false }).decode(plain);
          var stripped = xml.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          if (stripped) texts.push(stripped);
        }
      }
      return texts.join('\n').slice(0, 5000);
    }

    async function scanAttachmentFile(file) {
      state.fileScanProgress = 15;
      state.fileScanStatus = '파일 읽는 중...';
      render();

      var buf = await file.arrayBuffer();
      var bytes = new Uint8Array(buf);
      state.fileScanProgress = 45;
      state.fileScanStatus = '본문 텍스트 추출 중...';
      render();

      var lower = file.name.toLowerCase();
      var extracted = '';
      if (/\.(txt|md|csv|json|html|xml|log)$/i.test(lower)) {
        extracted = new TextDecoder('utf-8', { fatal: false }).decode(bytes).slice(0, 5000);
      } else if (/\.(docx|pptx|xlsx|hwpx)$/i.test(lower)) {
        extracted = await extractZipXmlText(bytes, /(word\/document\.xml|ppt\/slides\/slide|Contents\/section|xl\/sharedStrings)/i);
        if (!extracted) extracted = extractReadableFromBinary(bytes);
      } else {
        extracted = extractReadableFromBinary(bytes);
      }

      state.fileScanProgress = 80;
      state.fileScanStatus = '탐구 과정 및 핵심 키워드 분석 중...';
      render();
      await new Promise(function (r) { setTimeout(r, 250); });

      var sizeStr = file.size < 1048576 ? Math.max(1, Math.round(file.size / 1024)) + 'KB' : (file.size / 1048576).toFixed(1) + 'MB';
      var summaryText = extracted.trim()
        ? extracted.trim().slice(0, 1500)
        : file.name + ' (' + sizeStr + ') 첨부 완료 — 바이너리/스캔 문서로 핵심 설명을 상세내용에 보완해 주세요.';

      state.draftAttachments.push({
        fileName: file.name,
        fileSize: sizeStr,
        extractedText: summaryText
      });

      state.fileScanProgress = 100;
      state.fileScanStatus = '파일 스캔 완료';
      if (extracted.trim()) {
        state.pendingApplyScanText = summaryText;
      }
      render();
    }

    function extractKeywordsFromText(text) {
      var stop = { '그리고': 1, '대한': 1, '통해': 1, '위해': 1, '활용': 1, '탐구': 1, '활동': 1, '보고서': 1, '내용': 1, '분석': 1, '관련': 1, '수행': 1, '있는': 1, '하는': 1, '하여': 1 };
      var tokens = (text || '').match(/[가-힣a-zA-Z]{2,}/g) || [];
      var freq = {};
      tokens.forEach(function (tok) {
        if (stop[tok]) return;
        freq[tok] = (freq[tok] || 0) + 1;
      });
      return Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 8);
    }

    async function runAiLinkageAnalysis() {
      var chosen = state.records.filter(function (r) {
        return state.aiSelectedIds.indexOf(r.id) >= 0;
      });
      if (chosen.length < 2) {
        showToast('과목 간 내용 연계를 분석하려면 2개 이상의 탐구 기록을 선택해 주세요.');
        return;
      }

      var steps = [
        [25, '선택한 과목별 탐구 내용 및 첨부 데이터 대조 중...', '약 3초 남음'],
        [65, '공통 핵심 개념 및 과목 간 융합 연결고리 계산 중...', '약 1초 남음'],
        [100, '내용 연계 보고서 생성 완료', '완료']
      ];
      for (var i = 0; i < steps.length; i++) {
        state.aiProgress = steps[i][0];
        state.aiProgressMsg = steps[i][1];
        state.aiEtaText = steps[i][2];
        render();
        await new Promise(function (r) { setTimeout(r, 320); });

      var kws = extractKeywordsFromText(chosen.map(function (r) { return r.title + ' ' + (r.content || ''); }).join(' '));
      var subjectsStr = chosen.map(function (c) { return c.subject; }).join(' ↔ ');
      var kwText = kws.slice(0, 3).join(' · ') || '데이터 기반 논리 검증';
      var score = Math.min(4.9, (3.8 + chosen.length * 0.25 + (kws.length >= 4 ? 0.3 : 0))).toFixed(1);

      state.aiLinkageResult = {
        score: score,
        subjectsStr: subjectsStr,
        keywords: kws,
        reasoning: chosen[0].subject + '("' + chosen[0].title + '")의 개념적 탐구가 ' + chosen[1].subject + '("' + chosen[1].title + '")의 정량적·분석적 접근과 자연스럽게 이어져 ' + kwText + ' 중심의 입체적 학업 서사를 형성하고 있습니다.',
        advancedTopics: [
          {
            title: (kws[0] || chosen[0].subject) + ' 기반 ' + subjectsStr + ' 교차 검증 프로젝트',
            subjects: subjectsStr,
            description: '기존 탐구에서 도출한 가설을 다른 교과의 분석 모델로 재검증하는 심화 보고서 작성'

            subjects: chosen.map(function (c) { return c.subject; }).join(' · '),
            description: '이론적 탐구 결과를 실제 생활·사회 문제 해결 시나리오에 적용하고 한계점 보완'

    function renderLineChartSvg(points, yLabelMin, yLabelMax, invertY) {
      if (!points || points.length === 0) return '';
      var w = 520, h = 165, padL = 34, padR = 18, padT = 18, padB = 30;
      var innerW = w - padL - padR;
      var innerH = h - padT - padB;
      var coords = points.map(function (pt, idx) {
        var x = points.length === 1 ? padL + innerW / 2 : padL + (idx * innerW) / (points.length - 1);
        var ratio = (pt.val - yLabelMin) / Math.max(1, yLabelMax - yLabelMin);
        ratio = Math.max(0, Math.min(1, ratio));
        var y = invertY ? (padT + ratio * innerH) : (padT + (1 - ratio) * innerH);
        return { x: x, y: y, label: pt.label, valLabel: pt.valLabel };
      });
      var poly = coords.map(function (c) { return c.x.toFixed(1) + ',' + c.y.toFixed(1); }).join(' ');

      var gridLines = '';
      for (var g = 0; g <= 3; g++) {
        var gy = padT + (g * innerH) / 3;
        gridLines += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-dasharray="3 3" />';
      }
      var dots = coords.map(function (c) {
        return '<circle cx="' + c.x + '" cy="' + c.y + '" r="4.5" fill="#4338ca" stroke="#ffffff" stroke-width="2" />' +
          '<text x="' + c.x + '" y="' + (c.y - 9) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">' + esc(c.valLabel) + '</text>' +
          '<text x="' + c.x + '" y="' + (h - 8) + '" text-anchor="middle" font-size="10" fill="#64748b">' + esc(c.label.slice(0, 10)) + '</text>';
      }).join('');

      return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
        gridLines +
        (coords.length > 1 ? '<polyline fill="none" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' + poly + '" />' : '') +
        dots +
        '</svg>';
    }

                      '</div>';
                    }).join('')) +
              '</div>' +
            '</div>' +
          '</div>';
        } else {
          var avgMockRank = state.mockExams.length
            ? (state.mockExams.reduce(function (s, m) { return s + Number(m.gradeRank || 0); }, 0) / state.mockExams.length).toFixed(2)

            : '-';

              '<div class="kpi-box"><div class="kpi-label">기록 건수</div><div class="kpi-val tabular">' + state.mockExams.length + '건</div></div>' +
              '<div class="kpi-box"><div class="kpi-label">평균 등급</div><div class="kpi-val tabular">' + avgMockRank + (avgMockRank !== '-' ? '등급' : '') + '</div></div>' +
              '<div class="kpi-box"><div class="kpi-label">평균 원점수율</div><div class="kpi-val tabular">' + avgMockPct + (avgMockPct !== '-' ? '%' : '') + '</div></div>' +
            '</div>' +
            '<form id="mock-grade-form" class="row-wrap" style="align-items:flex-end">' +
              '<div style="flex:1 1 170px"><label class="label">모의고사 회차</label><select id="mg-exam" class="select">' +

              '</select></div>' +
              '<div style="flex:0 1 88px"><label class="label">원점수</label><input id="mg-score" class="input tabular" type="number" min="0" max="100" placeholder="88" required /></div>' +
              '<div style="flex:0 1 82px"><label class="label">만점</label><input id="mg-max" class="input tabular" type="number" min="10" max="100" value="100" required /></div>' +
              '<div style="flex:0 1 88px"><label class="label">등급</label><select id="mg-rank" class="select tabular">' +

              (state.mockExams.length === 0

                : state.mockExams.slice().reverse().map(function (m) {
                    return '<div class="item-box row-between">' +
                      '<div><span style="font-size:11.5px;color:#64748b">' + esc(m.examName) + '</span><p style="font-size:14px;font-weight:700">' + esc(m.subject) + ' · <span class="tabular" style="color:#4338ca">' + m.gradeRank + '등급</span> <span class="tabular" style="color:#475569;font-weight:500">(' + m.score + '/' + m.maxScore + '점' + (m.percentile ? ' · 백분위 ' + m.percentile : '') + ')</span></p></div>' +
                      '<button type="button" data-act="del-mock" data-id="' + esc(m.id) + '" class="btn btn-sm btn-outline">' + svgIcon('trash') + '</button>' +

            '</div>' +
          '</div>';

      return '<div class="stack-md">' +
        '<div class="seg-bar">' +
          '<button type="button" data-act="school-tab" data-sub="timetable" class="seg-btn ' + (state.schoolSubTab === 'timetable' ? 'active' : '') + '">시간표</button>' +
          '<button type="button" data-act="school-tab" data-sub="meal" class="seg-btn ' + (state.schoolSubTab === 'meal' ? 'active' : '') + '">급식</button>' +
          '<button type="button" data-act="school-tab" data-sub="grades" class="seg-btn ' + (state.schoolSubTab === 'grades' ? 'active' : '') + '">내 성적</button>' +
        '</div>' +

    function renderCalendarTab() {
      var y = state.calYear, m = state.calMonth;
      var firstDay = new Date(y, m, 1).getDay();
      var daysInMonth = new Date(y, m + 1, 0).getDate();
      var today = getTodayISO();

      var cells = '';
      for (var blank = 0; blank < firstDay; blank++) {
        cells += '<div></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var iso = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var dow = new Date(y, m, d).getDay();
        var count = state.records.filter(function (r) { return r.date === iso; }).length;
        var cls = 'cal-cell' + (iso === state.selectedDate ? ' selected' : '') + (iso === today ? ' today' : '');
        var numCls = 'cal-num tabular' + (dow === 0 ? ' sun' : (dow === 6 ? ' sat' : ''));
        cells += '<button type="button" data-act="cal-select" data-date="' + iso + '" class="' + cls + '">' +
          '<span class="' + numCls + '">' + d + '</span>' +
          (count > 0 ? '<span style="font-size:10px;font-weight:700;color:#4338ca">' + count + '건</span>' : '') +
        '</button>';
      }

      var dayItems = state.records.filter(function (r) { return r.date === state.selectedDate; });

      return '<div class="grid-2-12">' +
        '<div class="card col-7 stack-md">' +
          '<div class="row-between">' +
            '<h2 class="tabular" style="font-size:16px;font-weight:800">' + y + '년 ' + (m + 1) + '월</h2>' +
            '<div class="row-wrap">' +
              '<button type="button" data-act="cal-month" data-delta="-1" class="btn btn-sm btn-outline">' + svgIcon('left') + '</button>' +
              '<button type="button" data-act="cal-today" class="btn btn-sm btn-soft">오늘</button>' +
              '<button type="button" data-act="cal-month" data-delta="1" class="btn btn-sm btn-outline">' + svgIcon('right') + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="cal-grid">' +
            ['일', '월', '화', '수', '목', '금', '토'].map(function (dowName, idx) {
              var c = idx === 0 ? 'sun' : (idx === 6 ? 'sat' : '');
              return '<div class="cal-dow ' + c + '">' + dowName + '</div>';
            }).join('') +
            cells +
          '</div>' +
        '</div>' +
        '<div class="card col-5 stack-md">' +
          '<div>' +
            '<h3 class="tabular" style="font-size:15px;font-weight:800">' + esc(formatKoreanDate(state.selectedDate)) + '</h3>' +
            '<p style="font-size:12px;color:#64748b">삼성 리마인더처럼 간편하게 할 일을 추가하세요.</p>' +
          '</div>' +
          '<form id="reminder-form" class="stack-sm">' +
            '<div><label class="label">리마인더 제목</label><input id="rem-title" class="input" type="text" placeholder="예: 영어 단어 암기 시험" required /></div>' +
            '<div><label class="label">간단한 내용 (선택)</label><input id="rem-content" class="input" type="text" placeholder="예: Unit 5~6 범위 복습" /></div>' +
            '<button type="submit" class="btn btn-primary">' + svgIcon('plus') + '<span>이 날짜에 리마인더 추가</span></button>' +
          '</form>' +
          '<div class="stack-xs">' +
            (dayItems.length === 0
              ? '<div class="muted-box">선택한 날짜에 등록된 일정이 없습니다.</div>'
              : dayItems.map(function (r) {
                  return '<div class="item-box row-between">' +
                    '<div style="min-width:0">' +
                      '<span style="font-size:11px;font-weight:700;color:#4338ca">' + (r.kind === 'schedule' ? '리마인더' : esc(r.subject)) + '</span>' +
                      '<p style="font-size:13.5px;font-weight:700;' + (r.completed && r.kind === 'schedule' ? 'text-decoration:line-through;color:#94a3b8;' : '') + '">' + esc(r.title) + '</p>' +
                      (r.content ? '<p style="font-size:12px;color:#64748b">' + esc(r.content) + '</p>' : '') +
                    '</div>' +
                    '<div class="row-wrap" style="flex-shrink:0">' +
                      (r.kind === 'schedule' ? '<button type="button" data-act="toggle-rec" data-id="' + esc(r.id) + '" class="btn btn-sm btn-outline">' + svgIcon('check') + '</button>' : '') +
                      '<button type="button" data-act="del-rec" data-id="' + esc(r.id) + '" class="btn btn-sm btn-outline">' + svgIcon('trash') + '</button>' +
                    '</div>' +
                  '</div>';
                }).join('')) +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderUniListHtml() {
      var uq = state.uniQuery.trim().toLowerCase();
      var localUnis = KOREAN_UNIVERSITIES.filter(function (u) {
        return !uq || u.name.toLowerCase().indexOf(uq) >= 0 || u.location.toLowerCase().indexOf(uq) >= 0 ||
          u.aliases.some(function (a) { return a.toLowerCase().indexOf(uq) >= 0; });
      });
      var uniMap = {};
      var mergedUnis = [];
      localUnis.concat(state.webUniversities).forEach(function (u) {
        if (!uniMap[u.name]) { uniMap[u.name] = true; mergedUnis.push(u); }
      });
      mergedUnis = mergedUnis.slice(0, 14);
      if (mergedUnis.length === 0) {
        return '<div style="padding:12px;text-align:center;font-size:12px;color:#64748b">일치하는 대학이 없으면 &apos;웹에서 대학 검색&apos;을 누르거나 직접 입력하세요.</div>';
      }
      return mergedUnis.map(function (u) {
        var sel = state.profile.targetUniversity === u.name;
        return '<button type="button" data-act="pick-uni" data-name="' + esc(u.name) + '" class="dropdown-item ' + (sel ? 'selected' : '') + '">' +
          '<div style="min-width:0"><p style="font-size:13px;font-weight:700">' + esc(u.name) + '</p><p style="font-size:11px;color:#64748b" class="truncate">' + esc(u.location) + ' · ' + esc(u.category) + (u.majors && u.majors.length ? ' · ' + esc(u.majors.slice(0, 3).join(', ')) : '') + '</p></div>' +
          '<span style="font-size:11.5px;font-weight:700;color:' + (sel ? '#4338ca' : '#64748b') + '">' + (sel ? '선택됨' : '선택') + '</span>' +
        '</button>';
      }).join('');
    }

    function renderMajorListHtml() {
      var mq = state.majorQuery.trim().toLowerCase();
      var localMajors = mq ? KOREAN_MAJORS.filter(function (m) {
        return m.name.toLowerCase().indexOf(mq) >= 0 || m.field.toLowerCase().indexOf(mq) >= 0 ||
          (m.kw || []).some(function (k) { return k.indexOf(mq) >= 0; });
      }) : [];
      var majMap = {};
      var mergedMajors = [];
      state.webMajors.concat(localMajors).forEach(function (m) {
        if (!majMap[m.name]) { majMap[m.name] = true; mergedMajors.push(m); }
      });
      mergedMajors = mergedMajors.slice(0, 14);
      if (!state.showMajorDropdown || (mergedMajors.length === 0 && !state.isSearchingMajor)) return '';
      return '<div class="dropdown-list">' +
        (state.isSearchingMajor && mergedMajors.length === 0
          ? '<p style="padding:12px;font-size:12px;color:#64748b;text-align:center">학과를 웹에서 검색 중입니다...</p>'
          : mergedMajors.map(function (mj, idx) {

              return '<button type="button" data-act="pick-major" data-idx="' + idx + '" data-name="' + esc(mj.name) + '" class="dropdown-item ' + (sel ? 'selected' : '') + '">' +
                '<div style="min-width:0"><p style="font-size:13px;font-weight:700">' + esc(mj.name) + '</p><p style="font-size:11px;color:#64748b" class="truncate">' + (mj.college ? esc(mj.college) + ' · ' : '') + esc(mj.field) + (mj.description ? ' · ' + esc(mj.description) : '') + '</p></div>' +

    // =========================================================================
    // 11. 메인 Render & 이벤트 위임
    // =========================================================================
    function render() {
      var root = document.getElementById('app');
      if (!state.currentUser) {
        root.innerHTML = renderAuth() + (state.toastMsg ? '<div class="toast">' + esc(state.toastMsg) + '</div>' : '');
        return;
      }

      var upcomingAlerts = state.records
        .filter(function (r) { return !r.completed; })
        .map(function (r) { return { r: r, diff: getDiffDaysFromToday(r.date) }; })
        .filter(function (x) { return x.diff >= 0 && x.diff <= 3; })
        .sort(function (a, b) { return a.diff - b.diff; });

      var primary = upcomingAlerts[0];
      var bannerHtml = (primary && !state.bannerDismissed)
        ? '<div class="alert-banner"><div class="alert-banner-inner">' +
            '<div class="truncate"><strong class="tabular" style="color:#be123c">' + (primary.diff === 0 ? '오늘 마감' : 'D-' + primary.diff + ' 알림') + '</strong> · <span>' + esc(primary.r.title) + (upcomingAlerts.length > 1 ? ' 외 ' + (upcomingAlerts.length - 1) + '건' : '') + '</span></div>' +
            '<div class="row-wrap" style="flex-shrink:0"><button type="button" data-act="open-alerts" style="font-weight:700;color:#4338ca">전체 보기</button><button type="button" data-act="dismiss-banner" aria-label="닫기">' + svgIcon('x') + '</button></div>' +

      var displayAccount = (state.authUser && (state.authUser.displayName || state.authUser.email)) || state.currentUser;

        (state.profile.grade && state.profile.classNum) ? state.profile.grade + '학년 ' + state.profile.classNum + '반' : '',
        state.profile.name || displayAccount
      ].filter(Boolean);
      var subLine = subLineParts.length ? subLineParts.join(' · ') : displayAccount + '님의 세특 로그 & AI 연계 분석기';

      var titles = {
        schedule: '리마인더 · 탐구 타임라인',
        school: '우리 학교 · 시간표 · 급식 · 성적',
        calendar: '월간 학사 달력 · 리마인더',
        input: '수행평가 · 탐구 활동 기록',
        ai: 'AI 세특 요약 · 보관함 · 연계 분석',
        profile: '학생 프로필 · 목표 대학 · 데이터 백업'
      };

      var contentHtml = '';
      if (state.activeTab === 'schedule') contentHtml = renderScheduleTab();
      else if (state.activeTab === 'school') contentHtml = renderSchoolTab();
      else if (state.activeTab === 'calendar') contentHtml = renderCalendarTab();
      else if (state.activeTab === 'input') contentHtml = renderInputTab();
      else if (state.activeTab === 'ai') contentHtml = renderAiTab();
      else contentHtml = renderProfileTab();

      var modalHtml = state.showAlertModal
        ? '<div class="modal-backdrop"><div class="modal-panel stack-md">' +
            '<div class="row-between"><div><h2 style="font-size:16px;font-weight:800">D-3 / D-1 마감 알림 센터</h2><p style="font-size:12px;color:#64748b">3일 이내 마감 예정인 미완료 리마인더입니다.</p></div><button type="button" data-act="close-alerts" class="btn btn-sm btn-outline">' + svgIcon('x') + '</button></div>' +
            '<div class="stack-xs" style="overflow-y:auto">' +
              (upcomingAlerts.length === 0
                ? '<div class="muted-box">3일 이내 마감 예정인 미완료 리마인더가 없습니다.</div>'
                : upcomingAlerts.map(function (item) {
                    return '<div class="item-box row-between"><div><span class="tabular" style="font-size:11.5px;font-weight:700;color:#be123c">' + (item.diff === 0 ? '오늘 마감' : 'D-' + item.diff) + '</span> · <span style="font-size:11.5px;color:#64748b">' + esc(formatKoreanDate(item.r.date)) + '</span><p style="font-size:13.5px;font-weight:700">' + esc(item.r.title) + '</p></div><button type="button" data-act="toggle-rec" data-id="' + esc(item.r.id) + '" class="btn btn-sm btn-outline">완료</button></div>';
                  }).join('')) +
            '</div>' +
          '</div></div>'
        : '';

      var navTabs = [
        { k: 'schedule', l: '일정', i: 'list' },
        { k: 'school', l: '학교', i: 'school' },
        { k: 'calendar', l: '달력', i: 'cal' },
        { k: 'input', l: '과제입력', i: 'pen' },
        { k: 'ai', l: 'AI 기능', i: 'cpu' },
        { k: 'profile', l: '프로필', i: 'user' }
      ];

      var syncErrorBannerHtml = state.syncError
        ? '<div class="card" style="background:#fff1f2;border-color:#fecdd3;padding:12px 14px;margin-bottom:14px">' +
            '<div class="row-between" style="gap:10px;align-items:flex-start">' +
              '<div style="min-width:0;flex:1">' +
                '<p style="font-size:13px;font-weight:700;color:#be123c">클라우드 동기화 오류</p>' +
                '<p style="font-size:12px;color:#881337;margin-top:3px;word-break:break-word">' + esc(state.syncError) + '</p>' +
              '</div>' +
              '<div class="row-wrap" style="gap:6px;flex-shrink:0">' +
                '<button type="button" data-act="retry-cloud-sync" class="btn btn-sm btn-primary">다시 연결</button>' +
                '<button type="button" data-act="dismiss-sync-error" class="btn btn-sm btn-outline" aria-label="닫기">' + svgIcon('x') + '</button>' +
              '</div>' +
            '</div>' +
          '</div>'
        : '';

      root.innerHTML = '<div class="app-shell">' +
        '<header class="topbar"><div class="topbar-inner">' +
          '<button type="button" data-act="go-tab" data-tab="schedule" class="brand-btn">학교생활 도우미</button>' +
          '<div class="topbar-actions">' +
            '<button type="button" data-act="download-index-html" title="단일 index.html 파일로 다운로드" class="btn btn-sm btn-soft">' + svgIcon('download') + '<span>index.html</span></button>' +
            '<button type="button" data-act="open-alerts" class="btn btn-sm btn-outline">' + svgIcon('bell') + '<span>알림</span>' + (upcomingAlerts.length ? '<span class="badge-num tabular">' + upcomingAlerts.length + '</span>' : '') + '</button>' +
            '<button type="button" data-act="logout" aria-label="로그아웃" class="btn btn-sm btn-outline">' + svgIcon('logout') + '<span class="hide-xs">로그아웃</span></button>' +
          '</div>' +
        '</div></header>' +
        bannerHtml +
        '<main class="main-wrap">' +
          '<div class="page-header"><p class="page-sub">' + esc(subLine) + '</p><h1 class="page-title">' + esc(titles[state.activeTab]) + '</h1></div>' +
          syncErrorBannerHtml +
          contentHtml +
        '</main>' +
        '<nav class="bottom-nav" aria-label="하단 주 메뉴"><div class="bottom-nav-grid">' +
          navTabs.map(function (t) {
            return '<button type="button" data-act="go-tab" data-tab="' + t.k + '" class="nav-btn ' + (state.activeTab === t.k ? 'active' : '') + '">' + svgIcon(t.i) + '<span>' + t.l + '</span></button>';
          }).join('') +
        '</div></nav>' +
        modalHtml +
        (state.toastMsg ? '<div class="toast">' + esc(state.toastMsg) + '</div>' : '') +
      '</div>';
    }

    // 급식 자동 조회 트리거
    async function maybeAutoFetchMeal(force) {
      if (!state.currentUser || !state.profile.schoolName) return;
      var existing = state.meals.find(function (m) {
        return m.date === state.mealDate && m.mealType === state.mealType;
      });
      if (existing && !force) return;
      var key = state.profile.schoolName + '|' + state.mealDate + '|' + state.mealType;
      if (!force && state.mealAutoAttempted[key]) return;
      state.mealAutoAttempted[key] = true;
      state.isFetchingMeal = true;
      state.mealNoticeMsg = '';
      render();

      var res = await fetchSchoolMealLive(
        state.profile.schoolName,
        state.profile.officeCode,
        state.profile.schoolCode,
        state.mealDate,
        state.mealType
      );
      state.isFetchingMeal = false;
      if (res.found) {
        var mealId = 'meal-' + state.mealDate + '-' + (state.mealType === '조식' ? '1' : state.mealType === '석식' ? '3' : '2');
        var idx = state.meals.findIndex(function (m) {
          return m.date === state.mealDate && m.mealType === state.mealType;
        });
        var entry = {
          id: idx >= 0 ? state.meals[idx].id : mealId,
          date: state.mealDate,
          mealType: state.mealType,
          menu: res.menu,
          calories: res.calories || ''
        };
        if (idx >= 0) state.meals[idx] = entry;
        else state.meals.push(entry);
        savePart('meals');
        var bridge = getBridge();
        if (bridge && state.authUser && !state.authUser.isLocalFallback) {
          bridge.upsertMeal(entry, idx >= 0);
        }
        if (force) showToast('오늘의 식단을 불러왔습니다.');
      } else if (res.reason) {
        state.mealNoticeMsg = res.reason;
      }
      render();
    }

    // =========================================================================
    // 12. 전역 이벤트 핸들러 (DOM 재생성에도 안정적)
    // =========================================================================
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.getAttribute('data-act');

      if (act === 'google-login') {
        if (isLocalOfflineMode()) {
          state.authError = '로컬 파일(file://) 환경에서는 Google 팝업 로그인이 제한됩니다. Vercel 등 웹 주소에서 열거나 아래 로컬 오프라인 모드를 이용해 주세요.';
          render();
          return;
        }
        state.authError = '';
        state.isLoggingIn = true;
        render();

        var existingBridge = getBridge();
        var loginPromise = existingBridge
          ? existingBridge.signInWithGoogle()
          : ensureFirebaseBridge(true).then(function (b) {
              return b.signInWithGoogle();
            });

        loginPromise.then(function () {
          state.isLoggingIn = false;
          render();
        }).catch(function (err) {
          state.isLoggingIn = false;
          var code = err && err.code ? String(err.code) : '';
          if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
            state.authError = 'Google 로그인이 취소되었습니다. 다시 로그인 버튼을 눌러 주세요.';
          } else if (code === 'auth/popup-blocked') {
            state.authError = '브라우저에서 로그인 팝업이 차단되었습니다. 팝업 차단을 허용하거나 로그인 버튼을 한 번 더 눌러 주세요.';
          } else if (code === 'auth/unauthorized-domain') {
            state.authError = '현재 도메인(' + window.location.hostname + ')이 Firebase 승인 도메인에 등록되지 않았습니다. Firebase Console > Authentication > Settings > Authorized domains에 추가해 주세요.';
          } else {
            state.authError = 'Google 로그인 중 오류가 발생했습니다: ' + ((err && err.message) || code || '네트워크 또는 브라우저 설정을 확인해 주세요.');
          }
          render();
        });
      } else if (act === 'local-offline-login') {
        state.authError = '';
        state.currentUser = 'local-offline';
        state.authUser = { uid: 'local-offline', displayName: '오프라인 학생', email: '', isLocalFallback: true };
        loadLocalUserData('local-offline');
        render();
        showToast('로컬 오프라인 모드로 시작했습니다.');
      } else if (act === 'go-tab') {
        state.activeTab = btn.getAttribute('data-tab');
        savePart('tab');
        render();
        if (state.activeTab === 'school' && state.schoolSubTab === 'meal') {
          maybeAutoFetchMeal(false);
        }
      } else if (act === 'retry-cloud-sync') {
        state.syncError = '';
        render();
        var syncBridge = getBridge();
        if (syncBridge && syncBridge.retryCloudSync) {
          syncBridge.retryCloudSync();
          showToast('클라우드에 다시 연결하는 중입니다...');
        }
      } else if (act === 'dismiss-sync-error') {
        state.syncError = '';
        render();
      } else if (act === 'logout') {
        var outBridge = getBridge();
        if (outBridge && state.authUser && !state.authUser.isLocalFallback) {
          outBridge.signOutGoogle();
        } else {
          storage.remove(LEGACY_SESSION_KEY);
          state.currentUser = null;
          state.authUser = null;
          state.syncError = '';
          state.showAlertModal = false;
          render();
        }
      } else if (act === 'download-index-html') {
        try {
          var clone = document.documentElement.cloneNode(true);
          var scripts = clone.querySelectorAll('script[src]');
          for (var si = 0; si < scripts.length; si++) {
            var sSrc = scripts[si].getAttribute('src') || '';
            if (sSrc.indexOf('vite') >= 0 || sSrc.indexOf('@') >= 0 || sSrc.indexOf('/assets/') >= 0) {
              scripts[si].parentNode.removeChild(scripts[si]);
            }
          }
          var overlays = clone.querySelectorAll('vite-error-overlay');
          for (var oi = 0; oi < overlays.length; oi++) {
            overlays[oi].parentNode.removeChild(overlays[oi]);
          }
          var clonedApp = clone.querySelector('#app');
          if (clonedApp) clonedApp.innerHTML = '';
          var htmlStr = '<!doctype html>\n' + clone.outerHTML;
          var hBlob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
          var hUrl = URL.createObjectURL(hBlob);
          var dlLink = document.createElement('a');
          dlLink.href = hUrl;
          dlLink.download = 'index.html';
          document.body.appendChild(dlLink);
          dlLink.click();
          document.body.removeChild(dlLink);
          URL.revokeObjectURL(hUrl);
          showToast('단일 실행 파일(index.html)이 다운로드되었습니다.');
        } catch (err) {
          showToast('파일 다운로드 중 오류가 발생했습니다.');
        }
      } else if (act === 'open-alerts') {
        state.showAlertModal = true;
        render();
      } else if (act === 'close-alerts') {
        state.showAlertModal = false;
        render();
      } else if (act === 'dismiss-banner') {
        state.bannerDismissed = true;
        render();
      } else if (act === 'toggle-rec') {
        var tid = btn.getAttribute('data-id');
        var nextCompleted = false;
        state.records = state.records.map(function (r) {
          if (r.id === tid) {
            nextCompleted = !r.completed;
            return Object.assign({}, r, { completed: nextCompleted });
          }
          return r;
        });
        savePart('records');
        var bToggle = getBridge();
        if (bToggle && state.authUser && !state.authUser.isLocalFallback) {
          bToggle.toggleRecordCompleted(tid, nextCompleted);
        }
        render();
      } else if (act === 'del-rec') {
        var did = btn.getAttribute('data-id');
        state.records = state.records.filter(function (r) { return r.id !== did; });
        savePart('records');
        var bDelRec = getBridge();
        if (bDelRec && state.authUser && !state.authUser.isLocalFallback) {
          bDelRec.deleteSubDoc('records', did);
        }
        showToast('선택한 기록이 삭제되었습니다.');
      } else if (act === 'school-tab') {
        state.schoolSubTab = btn.getAttribute('data-sub');
        render();
        if (state.schoolSubTab === 'meal') maybeAutoFetchMeal(false);
      } else if (act === 'grade-mode') {
        state.gradeMode = btn.getAttribute('data-mode');
        render();
      } else if (act === 'meal-delta') {
        state.mealDate = addDaysISO(state.mealDate, Number(btn.getAttribute('data-delta')));
        state.mealNoticeMsg = '';
        render();
        maybeAutoFetchMeal(false);
      } else if (act === 'meal-type') {
        state.mealType = btn.getAttribute('data-type');
        state.mealNoticeMsg = '';
        render();
        maybeAutoFetchMeal(false);
      } else if (act === 'meal-refresh') {
        maybeAutoFetchMeal(true);
      } else if (act === 'del-grade') {
        var gid = btn.getAttribute('data-id');
        state.grades = state.grades.filter(function (g) { return g.id !== gid; });
        savePart('grades');
        var bDelGrd = getBridge();
        if (bDelGrd && state.authUser && !state.authUser.isLocalFallback) {
          bDelGrd.deleteSubDoc('grades', gid);
        }
        showToast('내신 성적이 삭제되었습니다.');
      } else if (act === 'del-mock') {
        var mid = btn.getAttribute('data-id');
        state.mockExams = state.mockExams.filter(function (m) { return m.id !== mid; });
        savePart('mockExams');
        var bDelMock = getBridge();
        if (bDelMock && state.authUser && !state.authUser.isLocalFallback) {
          bDelMock.deleteSubDoc('mockExams', mid);
        }
        showToast('모의고사 성적이 삭제되었습니다.');
      } else if (act === 'cal-select') {
        state.selectedDate = btn.getAttribute('data-date');
        render();
      } else if (act === 'cal-month') {
        var nm = state.calMonth + Number(btn.getAttribute('data-delta'));
        if (nm < 0) { state.calYear--; state.calMonth = 11; }
        else if (nm > 11) { state.calYear++; state.calMonth = 0; }
        else state.calMonth = nm;
        render();
      } else if (act === 'cal-today') {
        var now = new Date();
        state.calYear = now.getFullYear();
        state.calMonth = now.getMonth();
        state.selectedDate = getTodayISO();
        render();
      } else if (act === 'apply-scan') {
        var prev = (state.inputForm.content || '').trim();
        state.inputForm.content = prev ? prev + '\n\n' + state.pendingApplyScanText : state.pendingApplyScanText;
        state.pendingApplyScanText = '';
        showToast('스캔한 내용을 상세내용에 적용했습니다.');
      } else if (act === 'dismiss-scan') {
        state.pendingApplyScanText = '';
        render();
      } else if (act === 'del-draft-att') {
        var aidx = Number(btn.getAttribute('data-idx'));
        state.draftAttachments.splice(aidx, 1);
        render();
      } else if (act === 'pick-archive') {
        state.selectedArchiveId = btn.getAttribute('data-id');
        render();
      } else if (act === 'ai-tab') {
        state.aiSubTab = btn.getAttribute('data-sub');
        render();
      } else if (act === 'ai-toggle-rec') {
        var rid = btn.getAttribute('data-id');
        var pos = state.aiSelectedIds.indexOf(rid);
        if (pos >= 0) state.aiSelectedIds.splice(pos, 1);
        else state.aiSelectedIds.push(rid);
        render();
      } else if (act === 'run-ai-summary') {
        runAiSummaryAnalysis();
      } else if (act === 'run-ai-linkage') {
        runAiLinkageAnalysis();
      } else if (act === 'save-saeteuk') {
        var oidx = Number(btn.getAttribute('data-idx'));
        var opt = state.aiSummaryResult && state.aiSummaryResult.options[oidx];
        if (opt) {
          var newSt = {
            id: uid('st'),
            subject: opt.subject,
            title: opt.label,
            draft: opt.draft,
            keywords: (state.aiSummaryResult && state.aiSummaryResult.keywords) || [],
            sourceType: 'summary',
            updatedAt: new Date().toISOString()
          };
          state.savedSaeteuks.unshift(newSt);
          savePart('saeteuks');
          var bSt1 = getBridge();
          if (bSt1 && state.authUser && !state.authUser.isLocalFallback) {
            bSt1.createSaeteuk(newSt);
          }
          showToast('세특 보관함에 저장되었습니다.');
        }
      } else if (act === 'save-bridge-saeteuk') {
        if (state.aiLinkageResult) {
          var newBridgeSt = {
            id: uid('st'),
            subject: state.aiLinkageResult.subjectsStr,
            title: '과목 내용 연계 세특',
            draft: state.aiLinkageResult.bridgeDraft,
            keywords: state.aiLinkageResult.keywords || [],
            sourceType: 'linkage',
            updatedAt: new Date().toISOString()
          };
          state.savedSaeteuks.unshift(newBridgeSt);
          savePart('saeteuks');
          var bSt2 = getBridge();
          if (bSt2 && state.authUser && !state.authUser.isLocalFallback) {
            bSt2.createSaeteuk(newBridgeSt);
          }
          showToast('연계 세특이 보관함에 저장되었습니다.');
        }
      } else if (act === 'start-edit-saeteuk') {
        var sid = btn.getAttribute('data-id');
        var foundSt = state.savedSaeteuks.find(function (s) { return s.id === sid; });
        if (foundSt) {
          state.editingSaeteukId = sid;
          state.editingSaeteukDraft = foundSt.draft;
          render();
        }
      } else if (act === 'cancel-edit-saeteuk') {
        state.editingSaeteukId = '';
        render();
      } else if (act === 'commit-edit-saeteuk') {
        var csid = btn.getAttribute('data-id');

            var kKey = pair[0];
            var aKey = pair[1];
            var arr = raw && Array.isArray(raw[aKey]) ? raw[aKey] : (raw && Array.isArray(raw[kKey]) ? raw[kKey] : []);

            for (var i = 0; i < 8; i++) slots.push(safeStr(arr[i], 40));

          var mappedType = mealToCloudMap[m.mealType] || 'lunch';

                  var items = [];
                  qSnap.forEach(function (d) { items.push(Object.assign({ id: d.id }, d.data())); });

                function (err) {
                  state.syncError = formatCloudSyncError(err);

                  handleFirestoreError(err, OperationType.LIST, colPath);
